[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twinctl"
version = "0.1.0"
description = "Control surface for a traffic corridor digital twin (SUMO)."
requires-python = ">=3.9"
dependencies = ["sumolib"]

[project.scripts]
twinctl = "twinctl.cli:main"

[tool.setuptools]
packages = ["twinctl"]
